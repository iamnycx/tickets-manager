services:
    db:
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: tickets
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U postgres -d tickets -h localhost || exit 1',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build: ./backend
        restart: unless-stopped
        ports:
            - '8000:8000'
        environment:
            POSTGRES_DB: tickets
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_HOST: db
            LLM_API_KEY: ${LLM_API_KEY}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -f http://localhost:8000/api/health/ || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    frontend:
        build: ./frontend
        restart: unless-stopped
        expose:
            - '4173'
        ports:
            - '4173:4173'
        environment:
            VITE_API_URL: http://backend:8000/api
        depends_on:
            backend:
                condition: service_healthy

volumes:
    pgdata:
